<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3fa" />
    <meta name="description" content="가고 싶은 회사에 맞춰 면접을 준비해요." />
    <link rel="icon" href="/demos/career-center/icon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <title>커리어센터 체험판</title>
    <!-- 앱 코드보다 먼저 저장된 테마를 걸어 어두운 모드에서 밝은 화면이 깜빡이지 않게 한다 (lib/theme.ts와 같은 규칙) -->
    <style>
      html { background: #f4f3fa; }
      html.dark { background: #14121f; color-scheme: dark; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f4f3fa; color: #2b2840; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; transition: opacity 0.35s ease; }
      html.dark #boot { background: #14121f; color: #f1effa; }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      .boot-hamster { width: 148px; height: 148px; object-fit: contain; animation: boot-bob 1.6s ease-in-out infinite; }
      .boot-name { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
      .boot-bar { width: 180px; height: 8px; border-radius: 99px; background: #e4e0f5; overflow: hidden; }
      html.dark .boot-bar { background: #2f2852; }
      .boot-fill { width: 4%; height: 100%; border-radius: 99px; background: #6c4ef6; transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
      html.dark .boot-fill { background: #8f7bff; }
      .boot-step { font-size: 0.92rem; color: #6d6987; min-height: 1.4em; }
      html.dark .boot-step { color: #a9a4c4; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .boot-hamster { animation: none; } .boot-fill, #boot { transition: none; } }
    </style>
    <script>
      try {
        var t = localStorage.getItem('cc.theme.v1');
        if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14121f');
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/demos/career-center/assets/index-8MwCcy7y.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/career-center/assets/index-BzNJolyl.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 시작 로딩 화면. 앱 코드가 오기 전부터 보이고, src/lib/boot.ts가 단계마다 글과 막대를 바꾼 뒤 걷어 낸다 -->
    <div id="boot" role="status" aria-live="polite">
      <img class="boot-hamster" src="/demos/career-center/assets/coach/wave.webp" alt="" width="148" height="148" />
      <strong class="boot-name">커리어센터</strong>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <span class="boot-step">앱을 여는 중이에요</span>
    </div>
  </body>
</html>
